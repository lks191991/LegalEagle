{% extends 'base.html' %} {% block title %}LegalEagle - Welcome{% endblock %} {%
block content %}
<div
  class="container py-5"
  style="
    background: linear-gradient(120deg, #e3f0ff 60%, #f8faff 100%);
    min-height: 100vh;
  "
>
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow-lg border-0" style="background: #ffffff">
        <div
          class="card-header"
          style="background: #2563eb; color: #fff; border-radius: 8px 8px 0 0"
        >
          <h2 class="mb-0">
            <i
              class="fa-solid fa-scale-balanced me-2"
              style="color: #ffd700"
            ></i>
            LegalEagle
          </h2>
          <small style="color: #e0e7ef"
            >AI-powered legal contract assistant</small
          >
        </div>
        <div class="card-body" style="background: #f4f7fb">
          <div class="row text-center mb-4">
            <div class="col-md-12">
              <p class="lead" style="color: #2563eb; font-size: 1.25rem">
                Upload your contract or ask a legal question below.
              </p>
              <div class="d-flex justify-content-center gap-3 mb-4">
                <a
                  href="/upload"
                  class="btn btn-primary btn-lg"
                  style="background: #415a77; border: none"
                >
                  <i class="fa-solid fa-file-upload me-2"></i> Upload Documents
                </a>
                <a href="/chat" class="btn btn-outline-primary btn-lg">
                  <i class="fa-solid fa-comments me-2"></i> Start Chatting
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

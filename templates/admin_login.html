<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LegalEagle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light-gray d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card-box text-center">
                    <!-- Logo -->
                    <div class="mb-4">
                        <i class="fa-solid fa-scale-balanced fa-3x text-accent mb-3"></i>
                        <h2 class="fw-bold text-dark">LegalEagle</h2>
                    </div>
                    
                    <!-- Heading -->
                    <h3 class="fw-bold text-dark mb-4">Admin Login</h3>
                    
                    <!-- Error Message -->
                    {% if error %}
                    <div class="alert alert-danger mb-4">
                        <i class="fa-solid fa-exclamation-triangle me-2"></i>{{ error }}
                    </div>
                    {% endif %}
                    
                    <!-- Login Form -->
                    <form method="post" action="/admin/login">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-dark">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-dark">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold rounded-pill mb-3">
                            <i class="fa-solid fa-sign-in-alt me-2"></i>Login
                        </button>
                    </form>
                    
                    <!-- Back Link -->
                    <div class="text-center">
                        <a href="/login" class="text-accent text-decoration-none">
                            <i class="fa-solid fa-arrow-left me-1"></i>Back to User Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
